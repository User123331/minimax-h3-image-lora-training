# diffusion-pipe dataset config. setup.sh copies this to $WORKDIR/lora/<PROJECT>/dataset.toml with the paths filled in.
resolutions = [1024]      # the H3 Image VAE compresses 2x more than most; train at 1024 or more
enable_ar_bucket = true
min_ar = 0.5
max_ar = 2.0
num_ar_buckets = 9
frame_buckets = [1]       # images only
num_repeats = 1

[[directory]]
path = '/workspace/lora/mystyle/train'   # image + caption pairs only (tools/check_captions.py --stage)
